name: Build and publish portal demo images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'server/**'
      - 'shared/**'
      - 'themes/**'
      - 'tooling/**'
      - 'public/**'
      - 'scripts/**'
      - 'deployment/start.mjs'
      - 'Dockerfile'
      - '.dockerignore'
      - 'nuxt.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/publish-demo-images.yml'
permissions:
  contents: read
  packages: write
concurrency:
  group: portal-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        theme: [nuxtui, gcdesign]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Choose immutable release tag
        id: image
        env:
          THEME: ${{ matrix.theme }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-demo-${THEME}"
          echo "tag=${repository}:sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            PORTAL_THEME=${{ matrix.theme }}
            PORTAL_ENVIRONMENT=demo
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=portal-${{ matrix.theme }}
          cache-to: type=gha,mode=max,scope=portal-${{ matrix.theme }}
      - name: Verify the exact image before publishing
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: bash scripts/test-container-image.sh "$IMAGE"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push and capture digest
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          THEME: ${{ matrix.theme }}
        run: |
          docker push "$IMAGE"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          if [[ ! "$reference" =~ ^ghcr\.io/gcs-ssc/gcs-ssc-portal-demo-${THEME}@sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::Registry did not return the expected digest-pinned image'
            exit 1
          fi
          jq -n --arg theme "$THEME" --arg image "$reference" --arg commit "$GITHUB_SHA" '{theme:$theme,image:$image,commit:$commit}' > "image-${THEME}.json"
          printf 'Verified %s image: `%s`\n' "$THEME" "$reference" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-${{ matrix.theme }}
          path: image-${{ matrix.theme }}.json
          if-no-files-found: error
          retention-days: 90
